<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Faran Saskatoon Map</title>

<link
  href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
  rel="stylesheet"
/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
}

#toolbar {
  padding: 8px;
  background: white;
  z-index: 10;
}

#toolbar h2 {
  margin: 2px 0 7px;
  font-size: 19px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 5px;
}

button,
select,
input {
  border: 1px solid #aaa;
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 14px;
  background: white;
}

button {
  cursor: pointer;
}

button.active {
  background: #1769aa;
  color: white;
}

input {
  flex: 1;
  min-width: 170px;
}

#status {
  background: #fff3c4;
  padding: 8px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
}

#mapWrap {
  position: relative;
  flex: 1;
  min-height: 350px;
}

#map {
  position: absolute;
  inset: 0;
}

body.dark {
  background: #111;
  color: white;
}

body.dark #toolbar {
  background: #1d1d1d;
}

body.dark #status {
  background: #292929;
  color: white;
}

body.dark button,
body.dark select,
body.dark input {
  background: #333;
  color: white;
  border-color: #666;
}

body.dark .maplibregl-canvas {
  filter: brightness(.72) contrast(1.15);
}

/* Driving arrow */
.drive-arrow {
  width: 34px;
  height: 34px;
  transform-origin: center;
}

.drive-arrow-inner {
  width: 0;
  height: 0;
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-bottom: 32px solid #1976d2;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.55));
}

/* clicked address bubble */
.address-marker {
  background: rgba(255,255,255,.96);
  color: #111;
  border: 2px solid #111;
  border-radius: 9px;
  padding: 6px 8px;
  min-width: 115px;
  max-width: 190px;
  text-align: center;
  font-weight: bold;
  font-size: 12px;
  box-shadow: 0 2px 7px rgba(0,0,0,.35);
  cursor: pointer;
}

.hydrant-marker {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #e53935;
  color: white;
  border: 2px solid white;
  box-shadow: 0 1px 5px rgba(0,0,0,.55);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  cursor: pointer;
}

#driveInfo {
  position: absolute;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  background: rgba(20,20,20,.88);
  color: white;
  padding: 8px 14px;
  border-radius: 18px;
  font-size: 13px;
  display: none;
  white-space: nowrap;
}

#credit {
  position: absolute;
  bottom: 7px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  background: rgba(255,255,255,.9);
  color: #222;
  border-radius: 12px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: bold;
}

body.dark #credit {
  background: rgba(20,20,20,.9);
  color: white;
}

.maplibregl-ctrl-top-right {
  margin-top: 4px;
}
</style>
</head>

<body>
<div id="app">

  <div id="toolbar">

    <h2>Saskatoon Block Finder</h2>

    <div class="controls">
      <button id="followBtn">🚗 Start Drive</button>
      <button id="gpsBtn">📍 GPS</button>
      <button id="darkBtn">🌙 Night</button>
      <button id="northBtn">🧭 North</button>
      <button id="hydrantBtn">🔥 Hydrants</button>
    </div>

    <div class="controls">
      <button id="drawBtn">✏️ Draw</button>
      <button id="finishDrawBtn">✅ Finish + Save</button>
      <button id="clearDrawBtn">🗑 Clear</button>

      <select id="routeColor">
        <option value="#2196f3">Blue</option>
        <option value="#f44336">Red</option>
        <option value="#4caf50">Green</option>
        <option value="#ff9800">Orange</option>
        <option value="#9c27b0">Purple</option>
        <option value="#00bcd4">Cyan</option>
      </select>
    </div>

    <div class="controls">
      <button id="recordBtn">🔴 Record</button>
      <button id="pauseBtn">⏸ Pause</button>
      <button id="resumeBtn">▶ Resume</button>
      <button id="stopBtn">⏹ Stop</button>
      <button id="saveBtn">💾 Save</button>
    </div>

    <div class="controls">
      <select id="savedRoutes">
        <option value="">Select old route</option>
      </select>

      <button id="loadRouteBtn">Show Route</button>
      <button id="hideRouteBtn">Hide</button>
      <button id="deleteRouteBtn">Delete</button>
    </div>

    <div class="controls">
      <input
        id="searchBox"
        placeholder="Search Saskatoon street or address"
      >
      <button id="searchBtn">Search</button>
    </div>

    <div id="status">
      Tap a street to see its street name and block.
    </div>

  </div>

  <div id="mapWrap">
    <div id="map"></div>

    <div id="driveInfo"></div>

    <div id="credit">
      Saskatoon Block Finder • Made by Faran
    </div>
  </div>

</div>


<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<script>
/* =========================================================
   BASIC MAP
========================================================= */

const SASKATOON = [-106.6700, 52.1332];

const map = new maplibregl.Map({
  container: "map",

  style: {
    version: 8,

    sources: {
      osm: {
        type: "raster",
        tiles: [
          "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
        ],
        tileSize: 256,
        attribution: "© OpenStreetMap contributors"
      }
    },

    layers: [
      {
        id: "osm",
        type: "raster",
        source: "osm"
      }
    ]
  },

  center: SASKATOON,
  zoom: 12,

  /* 360 rotation */
  bearing: 0,
  pitch: 0,

  dragRotate: true,
  touchPitch: false
});


/* Built-in working compass */
map.addControl(
  new maplibregl.NavigationControl({
    showCompass: true,
    showZoom: true,
    visualizePitch: true
  }),
  "top-right"
);


/* =========================================================
   GLOBAL STATE
========================================================= */

let darkMode = false;

let addressMarker = null;

let gpsMarker = null;

let gpsAccuracySourceAdded = false;

let followMode = false;

let followWatchId = null;

let lastGps = null;

let lastHeading = 0;

let drawing = false;

let drawPoints = [];

let recording = false;

let recordingPaused = false;

let recordingWatchId = null;

let recordedPoints = [];

let loadedOldRoute = null;

let hydrantsOn = false;

let hydrantMarkers = [];

let blockCache = new Map();


/* =========================================================
   HELPERS
========================================================= */

function status(html) {
  document.getElementById("status").innerHTML = html;
}

function selectedColor() {
  return document.getElementById("routeColor").value;
}

function blockRange(number) {

  const n = parseInt(number);

  if (isNaN(n)) {
    return null;
  }

  const start = Math.floor(n / 100) * 100;

  return {
    start: start,
    end: start + 99,
    text: `${start}-${start + 99}`
  };
}


function distanceMetres(a, b) {

  const R = 6371000;

  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;

  const dLat =
    (b.lat - a.lat) * Math.PI / 180;

  const dLon =
    (b.lng - a.lng) * Math.PI / 180;

  const x =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) *
    Math.cos(lat2) *
    Math.sin(dLon / 2) ** 2;

  return R * 2 *
    Math.atan2(
      Math.sqrt(x),
      Math.sqrt(1 - x)
    );
}


function routeDistance(points) {

  let total = 0;

  for (let i = 1; i < points.length; i++) {
    total += distanceMetres(
      points[i - 1],
      points[i]
    );
  }

  return total;
}


/* Calculate direction between GPS positions */

function calculateBearing(a, b) {

  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;

  const dLon =
    (b.lng - a.lng) * Math.PI / 180;

  const y =
    Math.sin(dLon) *
    Math.cos(lat2);

  const x =
    Math.cos(lat1) *
    Math.sin(lat2) -
    Math.sin(lat1) *
    Math.cos(lat2) *
    Math.cos(dLon);

  let bearing =
    Math.atan2(y, x) * 180 / Math.PI;

  return (bearing + 360) % 360;
}


/* =========================================================
   DARK MODE
========================================================= */

document
  .getElementById("darkBtn")
  .addEventListener("click", () => {

    darkMode = !darkMode;

    document.body.classList.toggle(
      "dark",
      darkMode
    );

    status(
      darkMode
        ? "Night mode ON."
        : "Night mode OFF."
    );
  });


/* =========================================================
   NORTH
========================================================= */

document
  .getElementById("northBtn")
  .addEventListener("click", () => {

    map.easeTo({
      bearing: 0,
      duration: 500
    });
  });


/* =========================================================
   ADDRESS / BLOCK LOOKUP
========================================================= */

async function reverseGeocode(lat, lng) {

  const key =
    lat.toFixed(5) + "," +
    lng.toFixed(5);

  if (blockCache.has(key)) {
    return blockCache.get(key);
  }

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      4500
    );

  try {

    const url =
      "https://nominatim.openstreetmap.org/reverse" +
      "?format=jsonv2" +
      "&addressdetails=1" +
      "&zoom=18" +
      "&lat=" + lat +
      "&lon=" + lng;

    const response =
      await fetch(url, {
        signal: controller.signal
      });

    const data =
      await response.json();

    clearTimeout(timer);

    const a =
      data.address || {};

    const result = {

      road:
        a.road ||
        a.street ||
        a.residential ||
        a.pedestrian ||
        a.service ||
        "Street unknown",

      house:
        a.house_number ||
        null
    };

    blockCache.set(
      key,
      result
    );

    return result;

  } catch (error) {

    clearTimeout(timer);

    return {
      road: "Street unknown",
      house: null
    };
  }
}


/* fallback for empty streets */

async function findNearbyBlock(
  lat,
  lng,
  road
) {

  if (!road ||
      road === "Street unknown") {

    return null;
  }

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      3500
    );

  try {

    const safeRoad =
      road.replace(/"/g, '\\"');

    const query = `
[out:json][timeout:3];
(
 node["addr:housenumber"]["addr:street"="${safeRoad}"](around:220,${lat},${lng});
 way["addr:housenumber"]["addr:street"="${safeRoad}"](around:220,${lat},${lng});
);
out center tags 30;
`;

    const url =
      "https://overpass-api.de/api/interpreter?data=" +
      encodeURIComponent(query);

    const response =
      await fetch(url, {
        signal: controller.signal
      });

    const data =
      await response.json();

    clearTimeout(timer);

    let numbers = [];

    for (const item of data.elements) {

      const n =
        parseInt(
          item.tags?.["addr:housenumber"]
        );

      if (!isNaN(n)) {
        numbers.push(n);
      }
    }

    if (!numbers.length) {
      return null;
    }

    numbers.sort(
      (a, b) => a - b
    );

    const middle =
      numbers[
        Math.floor(numbers.length / 2)
      ];

    return blockRange(middle);

  } catch {

    clearTimeout(timer);
    return null;
  }
}


async function showBlock(
  lat,
  lng
) {

  status(
    "Finding street and block..."
  );

  const info =
    await reverseGeocode(
      lat,
      lng
    );

  let block =
    info.house
      ? blockRange(info.house)
      : null;

  /* show road immediately */

  status(
    `Street: ${info.road}<br>` +
    `Block: ${
      block
        ? block.text
        : "Estimating..."
    }`
  );

  if (!block) {

    block =
      await findNearbyBlock(
        lat,
        lng,
        info.road
      );
  }

  const blockText =
    block
      ? `${block.text} ${info.road}`
      : `Block unknown • ${info.road}`;

  status(
    `Street: ${info.road}<br>` +
    `Block: ${blockText}` +
    (
      info.house
        ? `<br>Nearest address: ${info.house}`
        : ""
    )
  );


  /* remove previous */
  if (addressMarker) {
    addressMarker.remove();
  }


  const box =
    document.createElement("div");

  box.className =
    "address-marker";

  box.innerHTML =
    (
      info.house
        ? `${info.house}<br>`
        : ""
    ) +
    blockText +
    "<br><small>Tap to close</small>";


  addressMarker =
    new maplibregl.Marker({
      element: box,
      anchor: "bottom"
    })
    .setLngLat([lng, lat])
    .addTo(map);


  /* Tap it again = disappear */

  box.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      if (addressMarker) {
        addressMarker.remove();
        addressMarker = null;
      }
    }
  );
}


/* Map click */

map.on(
  "click",
  event => {

    if (drawing) {

      addDrawPoint(
        event.lngLat.lat,
        event.lngLat.lng
      );

      return;
    }

    showBlock(
      event.lngLat.lat,
      event.lngLat.lng
    );
  }
);


/* =========================================================
   SEARCH
========================================================= */

document
  .getElementById("searchBtn")
  .addEventListener(
    "click",
    searchPlace
  );

document
  .getElementById("searchBox")
  .addEventListener(
    "keydown",
    e => {

      if (e.key === "Enter") {
        searchPlace();
      }
    }
  );


async function searchPlace() {

  const text =
    document
      .getElementById("searchBox")
      .value
      .trim();

  if (!text) {
    return;
  }

  status("Searching...");

  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(
        text +
        ", Saskatoon, Saskatchewan, Canada"
      );

    const response =
      await fetch(url);

    const data =
      await response.json();

    if (!data.length) {

      status(
        "Address not found."
      );

      return;
    }

    const lat =
      parseFloat(data[0].lat);

    const lng =
      parseFloat(data[0].lon);

    map.flyTo({
      center: [lng, lat],
      zoom: 18,
      duration: 700
    });

    showBlock(lat, lng);

  } catch {

    status(
      "Search error."
    );
  }
}


/* =========================================================
   GPS ARROW
========================================================= */

function createGpsArrow() {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "drive-arrow";

  const arrow =
    document.createElement("div");

  arrow.className =
    "drive-arrow-inner";

  wrapper.appendChild(arrow);

  return wrapper;
}


function updateGpsMarker(
  lng,
  lat,
  heading
) {

  if (!gpsMarker) {

    gpsMarker =
      new maplibregl.Marker({
        element:
          createGpsArrow(),

        rotationAlignment:
          "map",

        pitchAlignment:
          "map"
      })
      .setLngLat([lng, lat])
      .addTo(map);
  }

  gpsMarker
    .setLngLat([lng, lat])
    .setRotation(heading);
}


/* =========================================================
   SINGLE GPS LOCATION
========================================================= */

document
  .getElementById("gpsBtn")
  .addEventListener(
    "click",
    getAccurateLocation
  );


function getAccurateLocation() {

  if (!navigator.geolocation) {

    status(
      "GPS not supported."
    );

    return;
  }

  status(
    "Getting accurate GPS..."
  );

  let best = null;

  let readings = 0;

  const watcher =
    navigator.geolocation.watchPosition(

      position => {

        readings++;

        if (
          !best ||
          position.coords.accuracy <
          best.coords.accuracy
        ) {

          best = position;
        }

        status(
          `GPS accuracy: ±${
            Math.round(
              position.coords.accuracy
            )
          } m`
        );


        if (
          position.coords.accuracy <= 8 ||
          readings >= 7
        ) {

          navigator.geolocation
            .clearWatch(watcher);

          const lat =
            best.coords.latitude;

          const lng =
            best.coords.longitude;

          updateGpsMarker(
            lng,
            lat,
            0
          );

          map.flyTo({
            center: [lng, lat],
            zoom: 18,
            duration: 500
          });

          showBlock(lat, lng);
        }
      },

      error => {

        status(
          "Location permission is required."
        );
      },

      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );
}


/* =========================================================
   GOOGLE-MAPS STYLE DRIVE FOLLOW
========================================================= */

document
  .getElementById("followBtn")
  .addEventListener(
    "click",
    toggleFollowMode
  );


function toggleFollowMode() {

  if (followMode) {
    stopFollowMode();
  } else {
    startFollowMode();
  }
}


function startFollowMode() {

  if (!navigator.geolocation) {

    status(
      "GPS not supported."
    );

    return;
  }

  followMode = true;

  document
    .getElementById("followBtn")
    .classList.add("active");

  document
    .getElementById("followBtn")
    .textContent =
      "🚗 Stop Drive";

  document
    .getElementById("driveInfo")
    .style.display =
      "block";

  status(
    "Drive mode starting..."
  );


  followWatchId =
    navigator.geolocation.watchPosition(

      position => {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        let heading =
          position.coords.heading;


        /*
          Many phones return null heading
          while standing still.
          When moving, calculate it from
          previous GPS positions.
        */

        if (
          heading == null ||
          isNaN(heading)
        ) {

          if (lastGps) {

            const moved =
              distanceMetres(
                lastGps,
                { lat, lng }
              );

            if (moved >= 2) {

              heading =
                calculateBearing(
                  lastGps,
                  { lat, lng }
                );
            }
          }
        }


        if (
          heading != null &&
          !isNaN(heading)
        ) {

          lastHeading =
            heading;
        }


        updateGpsMarker(
          lng,
          lat,
          lastHeading
        );


        /*
          Keep user lower on screen,
          similar to navigation apps.
        */

        map.easeTo({

          center:
            [lng, lat],

          zoom:
            Math.max(
              map.getZoom(),
              17
            ),

          bearing:
            lastHeading,

          pitch:
            0,

          duration:
            500,

          padding: {
            top: 100,
            bottom: 180,
            left: 20,
            right: 20
          }
        });


        const speed =
          position.coords.speed;


        const speedKmh =
          speed != null
            ? Math.max(0, speed * 3.6)
            : null;


        document
          .getElementById("driveInfo")
          .innerHTML =

          (
            speedKmh != null
              ? `${speedKmh.toFixed(0)} km/h • `
              : ""
          ) +

          `GPS ±${Math.round(accuracy)} m`;


        lastGps =
          { lat, lng };
      },

      error => {

        status(
          "Please allow precise location."
        );

        stopFollowMode();
      },

      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );
}


function stopFollowMode() {

  followMode = false;

  if (followWatchId != null) {

    navigator.geolocation
      .clearWatch(followWatchId);

    followWatchId = null;
  }

  document
    .getElementById("followBtn")
    .classList.remove("active");

  document
    .getElementById("followBtn")
    .textContent =
      "🚗 Start Drive";

  document
    .getElementById("driveInfo")
    .style.display =
      "none";

  status(
    "Drive mode stopped."
  );
}


/* =========================================================
   MANUAL DRAW ROUTE
========================================================= */

function ensureLineSource(
  id,
  points,
  color,
  opacity = .55,
  width = 6,
  dash = null
) {

  const geojson = {
    type: "Feature",
    geometry: {
      type: "LineString",
      coordinates:
        points.map(
          p => [p.lng, p.lat]
        )
    }
  };


  if (map.getSource(id)) {

    map
      .getSource(id)
      .setData(geojson);

    return;
  }


  map.addSource(id, {
    type: "geojson",
    data: geojson
  });


  const paint = {
    "line-color": color,
    "line-width": width,
    "line-opacity": opacity
  };


  if (dash) {
    paint["line-dasharray"] = dash;
  }


  map.addLayer({
    id: id,
    type: "line",
    source: id,
    layout: {
      "line-join": "round",
      "line-cap": "round"
    },
    paint
  });
}


function removeLine(id) {

  if (map.getLayer(id)) {
    map.removeLayer(id);
  }

  if (map.getSource(id)) {
    map.removeSource(id);
  }
}


document
  .getElementById("drawBtn")
  .addEventListener(
    "click",
    () => {

      drawing = true;

      drawPoints = [];

      removeLine("drawRoute");

      status(
        "Draw mode ON. Tap points on the map."
      );
    }
  );


function addDrawPoint(lat, lng) {

  drawPoints.push({
    lat,
    lng
  });

  ensureLineSource(
    "drawRoute",
    drawPoints,
    selectedColor(),
    .5,
    7
  );

  status(
    `Drawing... ${
      (
        routeDistance(drawPoints) /
        1000
      ).toFixed(2)
    } km`
  );
}


document
  .getElementById("finishDrawBtn")
  .addEventListener(
    "click",
    () => {

      drawing = false;

      if (drawPoints.length < 2) {

        alert(
          "Draw at least two points."
        );

        return;
      }

      let name =
        prompt(
          "Name this route:"
        );

      if (!name) {

        name =
          "Drawn Route";
      }

      saveRoute(
        name,
        drawPoints,
        selectedColor()
      );

      status(
        `${name} saved to old routes.`
      );
    }
  );


document
  .getElementById("clearDrawBtn")
  .addEventListener(
    "click",
    () => {

      drawing = false;

      drawPoints = [];

      removeLine(
        "drawRoute"
      );

      status(
        "Draw route cleared."
      );
    }
  );


/* =========================================================
   GPS RECORDING
========================================================= */

document
  .getElementById("recordBtn")
  .addEventListener(
    "click",
    startRecording
  );


function startRecording() {

  if (!navigator.geolocation) {
    return;
  }

  if (recordingWatchId != null) {

    navigator.geolocation
      .clearWatch(
        recordingWatchId
      );
  }

  recordedPoints = [];

  recording = true;

  recordingPaused = false;

  removeLine(
    "recordedRoute"
  );


  recordingWatchId =
    navigator.geolocation.watchPosition(

      position => {

        if (
          !recording ||
          recordingPaused
        ) {
          return;
        }

        /*
          Ignore very poor GPS
          so random jumps don't ruin route
        */

        if (
          position.coords.accuracy >
          45
        ) {
          return;
        }

        const point = {

          lat:
            position.coords.latitude,

          lng:
            position.coords.longitude
        };


        /*
          Ignore tiny GPS jitter
        */

        const previous =
          recordedPoints[
            recordedPoints.length - 1
          ];

        if (previous) {

          const moved =
            distanceMetres(
              previous,
              point
            );

          if (moved < 1.5) {
            return;
          }
        }


        recordedPoints.push(
          point
        );


        ensureLineSource(
          "recordedRoute",
          recordedPoints,
          selectedColor(),
          .55,
          7
        );


        status(
          `Recording • ${
            (
              routeDistance(
                recordedPoints
              ) / 1000
            ).toFixed(2)
          } km • GPS ±${
            Math.round(
              position.coords.accuracy
            )
          } m`
        );
      },

      () => {

        status(
          "GPS recording error."
        );
      },

      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );


  status(
    "Recording started."
  );
}


document
  .getElementById("pauseBtn")
  .addEventListener(
    "click",
    () => {

      if (!recording) {
        return;
      }

      recordingPaused = true;

      status(
        "Recording paused."
      );
    }
  );


document
  .getElementById("resumeBtn")
  .addEventListener(
    "click",
    () => {

      if (!recording) {
        return;
      }

      recordingPaused = false;

      status(
        "Recording resumed."
      );
    }
  );


document
  .getElementById("stopBtn")
  .addEventListener(
    "click",
    () => {

      recording = false;

      recordingPaused = false;

      if (
        recordingWatchId != null
      ) {

        navigator.geolocation
          .clearWatch(
            recordingWatchId
          );

        recordingWatchId = null;
      }

      status(
        `Recording stopped • ${
          (
            routeDistance(
              recordedPoints
            ) / 1000
          ).toFixed(2)
        } km`
      );
    }
  );


document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    () => {

      if (
        recordedPoints.length < 2
      ) {

        alert(
          "No route to save."
        );

        return;
      }

      const name =
        prompt(
          "Route name:"
        );

      if (!name) {
        return;
      }

      saveRoute(
        name,
        recordedPoints,
        selectedColor()
      );

      status(
        `${name} saved.`
      );
    }
  );


/* =========================================================
   SAVED ROUTES
========================================================= */

function getRoutes() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "faranRoutes"
      ) || "[]"
    );

  } catch {

    return [];
  }
}


function saveRoute(
  name,
  points,
  color
) {

  const routes =
    getRoutes();

  routes.push({

    id:
      Date.now(),

    name,

    date:
      new Date()
        .toLocaleString(),

    color,

    points
  });

  localStorage.setItem(
    "faranRoutes",
    JSON.stringify(routes)
  );

  refreshRoutes();
}


function refreshRoutes() {

  const selector =
    document.getElementById(
      "savedRoutes"
    );

  selector.innerHTML =
    '<option value="">Select old route</option>';

  getRoutes().forEach(
    route => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        route.id;

      option.textContent =
        route.name +
        " • " +
        route.date;

      selector.appendChild(
        option
      );
    }
  );
}


document
  .getElementById("loadRouteBtn")
  .addEventListener(
    "click",
    () => {

      const id =
        Number(
          document
            .getElementById(
              "savedRoutes"
            )
            .value
        );

      if (!id) {
        return;
      }

      const route =
        getRoutes()
          .find(
            r => r.id === id
          );

      if (!route) {
        return;
      }

      removeLine(
        "oldRoute"
      );

      loadedOldRoute =
        route;

      ensureLineSource(
        "oldRoute",
        route.points,
        route.color,
        .38,
        9,
        [2, 1.5]
      );


      const bounds =
        new maplibregl
          .LngLatBounds();

      route.points
        .forEach(
          point =>
            bounds.extend(
              [
                point.lng,
                point.lat
              ]
            )
        );

      map.fitBounds(
        bounds,
        {
          padding: 60,
          maxZoom: 17
        }
      );

      status(
        `Old route "${route.name}" loaded. ` +
        `You can record a new route while it stays visible.`
      );
    }
  );


document
  .getElementById("hideRouteBtn")
  .addEventListener(
    "click",
    () => {

      removeLine(
        "oldRoute"
      );

      loadedOldRoute =
        null;

      status(
        "Old route hidden."
      );
    }
  );


document
  .getElementById("deleteRouteBtn")
  .addEventListener(
    "click",
    () => {

      const id =
        Number(
          document
            .getElementById(
              "savedRoutes"
            )
            .value
        );

      if (!id) {

        alert(
          "Select a route."
        );

        return;
      }

      let routes =
        getRoutes();

      routes =
        routes.filter(
          route =>
            route.id !== id
        );

      localStorage.setItem(
        "faranRoutes",
        JSON.stringify(routes)
      );

      removeLine(
        "oldRoute"
      );

      refreshRoutes();

      status(
        "Route deleted."
      );
    }
  );


/* =========================================================
   FIRE HYDRANTS
========================================================= */

/*
  ArcGIS point FeatureServer
*/

const HYDRANT_SERVICE =
  "https://services5.arcgis.com/aqscDN0KMPbfyKhW/ArcGIS/rest/services/Fire_Hydrants/FeatureServer/1/query";


const REPORT_HYDRANT_URL =
  "https://service.saskatoon.ca/site/saskatoon/request/cos_report_firehydrantissue";


document
  .getElementById("hydrantBtn")
  .addEventListener(
    "click",
    async () => {

      hydrantsOn =
        !hydrantsOn;

      const button =
        document.getElementById(
          "hydrantBtn"
        );

      button.classList.toggle(
        "active",
        hydrantsOn
      );


      if (!hydrantsOn) {

        clearHydrants();

        status(
          "Hydrants hidden."
        );

        return;
      }


      button.textContent =
        "🔥 Hydrants ON";

      await loadHydrants();
    }
  );


function clearHydrants() {

  hydrantMarkers
    .forEach(
      marker =>
        marker.remove()
    );

  hydrantMarkers = [];

  document
    .getElementById(
      "hydrantBtn"
    )
    .textContent =
      "🔥 Hydrants";
}


async function loadHydrants() {

  if (!hydrantsOn) {
    return;
  }

  status(
    "Loading nearby hydrants..."
  );


  clearHydrants();

  hydrantsOn = true;

  document
    .getElementById(
      "hydrantBtn"
    )
    .classList.add(
      "active"
    );

  document
    .getElementById(
      "hydrantBtn"
    )
    .textContent =
      "🔥 Hydrants ON";


  const bounds =
    map.getBounds();


  const bbox =
    [
      bounds.getWest(),
      bounds.getSouth(),
      bounds.getEast(),
      bounds.getNorth()
    ].join(",");


  const params =
    new URLSearchParams({

      where:
        "1=1",

      geometry:
        bbox,

      geometryType:
        "esriGeometryEnvelope",

      inSR:
        "4326",

      spatialRel:
        "esriSpatialRelIntersects",

      outFields:
        "HYDRANTID,FACILITYID,LOCDESC,OPERABLE,INSPECTDT",

      returnGeometry:
        "true",

      outSR:
        "4326",

      f:
        "geojson"
    });


  try {

    const response =
      await fetch(
        HYDRANT_SERVICE +
        "?" +
        params.toString()
      );


    if (!response.ok) {
      throw new Error(
        "Hydrant service error"
      );
    }


    const data =
      await response.json();


    const features =
      data.features || [];


    for (
      const feature
      of features
    ) {

      if (
        feature.geometry?.type
        !== "Point"
      ) {
        continue;
      }


      const [
        lng,
        lat
      ] =
        feature.geometry.coordinates;


      const properties =
        feature.properties || {};


      const element =
        document.createElement(
          "div"
        );

      element.className =
        "hydrant-marker";

      element.textContent =
        "H";


      const popup =
        new maplibregl.Popup({
          offset: 18
        })
        .setHTML(
          `<strong>🔥 Fire Hydrant</strong><br>` +

          (
            properties.HYDRANTID
              ? `ID: ${properties.HYDRANTID}<br>`
              : ""
          ) +

          (
            properties.LOCDESC
              ? `Location: ${properties.LOCDESC}<br>`
              : ""
          ) +

          (
            properties.OPERABLE
              ? `Operable: ${properties.OPERABLE}<br>`
              : ""
          ) +

          `<br>` +

          `<a href="${REPORT_HYDRANT_URL}" target="_blank">Report hydrant issue</a>`
        );


      const hydrantMarker =
        new maplibregl.Marker({
          element
        })
        .setLngLat(
          [lng, lat]
        )
        .setPopup(
          popup
        )
        .addTo(
          map
        );


      hydrantMarkers.push(
        hydrantMarker
      );
    }


    status(
      `${features.length} hydrants loaded in this map area.`
    );


  } catch (error) {

    console.error(
      error
    );

    status(
      "Hydrant data could not be loaded right now."
    );
  }
}


/*
  Refresh hydrants when user
  moves to another part of city
*/

let hydrantRefreshTimer =
  null;


map.on(
  "moveend",
  () => {

    if (!hydrantsOn) {
      return;
    }

    clearTimeout(
      hydrantRefreshTimer
    );

    hydrantRefreshTimer =
      setTimeout(
        loadHydrants,
        500
      );
  }
);


/* =========================================================
   AUTO START LOCATION
========================================================= */

map.on(
  "load",
  () => {

    refreshRoutes();

    status(
      "Map ready. Requesting your location..."
    );


    /*
      Try automatically.
      If browser requires interaction,
      user can press Start Drive.
    */

    setTimeout(
      () => {

        startFollowMode();

      },
      700
    );
  }
);
</script>
