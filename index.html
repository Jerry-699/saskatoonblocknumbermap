<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Saskatoon Block Finder</title>

<link
  href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
  rel="stylesheet"
/>

<style>
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
}

#map {
  position: absolute;
  inset: 0;
}

/* =========================
   MAP CONTROLS
========================= */

/* Keep zoom + compass readable even in night mode */

.maplibregl-ctrl-group {
  background: white !important;
  border-radius: 9px !important;
  overflow: hidden;
  box-shadow: 0 2px 7px rgba(0,0,0,.35) !important;
}

.maplibregl-ctrl-group button {
  background-color: white !important;
}

.maplibregl-ctrl-group button:hover {
  background-color: #eeeeee !important;
}

.maplibregl-ctrl-icon {
  filter: none !important;
}

.maplibregl-ctrl-compass .maplibregl-ctrl-icon,
.maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon,
.maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon {
  opacity: 1 !important;
}


/* =========================
   MENU BUTTON
========================= */

#menuButton {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 30;

  width: 48px;
  height: 48px;

  border: 0;
  border-radius: 50%;

  background: rgba(255,255,255,.96);
  color: #111;

  font-size: 27px;
  font-weight: bold;

  box-shadow: 0 2px 9px rgba(0,0,0,.35);

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}


/* =========================
   MENU
========================= */

#toolbar {
  position: absolute;

  top: 68px;
  left: 10px;

  z-index: 29;

  width: min(365px, calc(100vw - 20px));
  max-height: calc(100vh - 90px);

  overflow-y: auto;

  padding: 10px;

  box-sizing: border-box;

  border-radius: 14px;

  background: rgba(255,255,255,.97);

  box-shadow: 0 4px 16px rgba(0,0,0,.3);

  transition:
    opacity .2s ease,
    transform .2s ease;
}

#toolbar.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateX(-110%);
}

#toolbar h2 {
  margin: 2px 0 9px;
  font-size: 19px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 7px;
}

button,
select,
input {
  font-size: 15px;
  min-height: 42px;

  border-radius: 8px;
  border: 1px solid #aaa;

  background: white;

  padding: 8px 10px;

  box-sizing: border-box;
}

button {
  cursor: pointer;
}

button.active {
  background: #1769aa;
  color: white;
}

input {
  width: 100%;
}

select {
  max-width: 100%;
}

#status {
  padding: 9px;
  margin-top: 5px;

  border-radius: 8px;

  background: #fff3c4;

  font-size: 13px;
  font-weight: bold;

  line-height: 1.45;
}


/* =========================
   NIGHT MODE UI
========================= */

body.dark #toolbar {
  background: rgba(24,24,24,.96);
  color: white;
}

body.dark #menuButton {
  background: #f5f5f5;
  color: #111;
}

body.dark button,
body.dark select,
body.dark input {
  background: #333;
  color: white;
  border-color: #666;
}

body.dark #status {
  background: #292929;
  color: white;
}

/*
IMPORTANT:
Do NOT filter the entire MapLibre canvas.
The map itself is adjusted using MapLibre
raster paint settings in JavaScript.
*/


/* =========================
   GPS ARROW
========================= */

.drive-arrow {
  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.drive-arrow-inner {
  width: 0;
  height: 0;

  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-bottom: 35px solid #1976d2;

  filter:
    drop-shadow(0 2px 3px rgba(0,0,0,.75));
}


/* =========================
   ADDRESS LABEL
========================= */

.address-marker {
  background: rgba(255,255,255,.98);
  color: #111;

  border: 2px solid #111;
  border-radius: 9px;

  padding: 7px 9px;

  min-width: 125px;
  max-width: 200px;

  text-align: center;

  font-weight: bold;
  font-size: 13px;

  box-shadow:
    0 2px 7px rgba(0,0,0,.4);

  cursor: pointer;
}


/* =========================
   DRIVE INFO
========================= */

#driveInfo {
  position: absolute;

  left: 50%;
  bottom: 40px;

  transform: translateX(-50%);

  z-index: 20;

  background: rgba(20,20,20,.90);
  color: white;

  padding: 8px 14px;

  border-radius: 18px;

  font-size: 13px;
  font-weight: bold;

  display: none;

  white-space: nowrap;
}


/* =========================
   CREDIT
========================= */

#credit {
  position: absolute;

  bottom: 7px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 20;

  background: rgba(255,255,255,.92);
  color: #222;

  padding: 4px 10px;

  border-radius: 12px;

  font-size: 11px;
  font-weight: bold;
}

body.dark #credit {
  background: rgba(20,20,20,.9);
  color: white;
}
</style>
</head>

<script
  src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js">
</script>


<script>

/* =====================================================
   MAP
===================================================== */

const OSM_TILES =
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png";


const map =
  new maplibregl.Map({

    container:
      "map",

    style: {

      version:
        8,

      sources: {

        osm: {

          type:
            "raster",

          tiles: [
            OSM_TILES
          ],

          tileSize:
            256,

          attribution:
            "© OpenStreetMap contributors"

        }

      },


      layers: [

        {

          id:
            "osm",

          type:
            "raster",

          source:
            "osm",

          paint: {

            "raster-opacity":
              1,

            "raster-brightness-min":
              0,

            "raster-brightness-max":
              1,

            "raster-saturation":
              0,

            "raster-contrast":
              0

          }

        }

      ]

    },


    center: [
      -106.6700,
      52.1332
    ],

    zoom:
      12,

    bearing:
      0,

    pitch:
      0,

    dragRotate:
      true,

    touchPitch:
      false

  });


map.addControl(

  new maplibregl.NavigationControl({

    showCompass:
      true,

    showZoom:
      true,

    visualizePitch:
      false

  }),

  "top-right"

);


/* =====================================================
   MENU
===================================================== */

const toolbar =
  document.getElementById(
    "toolbar"
  );

const menuButton =
  document.getElementById(
    "menuButton"
  );


let menuOpen =
  true;


function setMenu(open) {

  menuOpen =
    open;


  toolbar.classList.toggle(

    "hidden",

    !open

  );


  menuButton.textContent =
    open
      ? "×"
      : "⋮";


  menuButton.setAttribute(

    "aria-label",

    open
      ? "Close menu"
      : "Open menu"

  );


  setTimeout(

    () =>
      map.resize(),

    220

  );

}


menuButton.addEventListener(

  "click",

  () => {

    setMenu(
      !menuOpen
    );

  }

);


/* Start full map on phones */

if (

  window.matchMedia(
    "(max-width: 650px)"
  ).matches

) {

  setMenu(false);

}


/* =====================================================
   STATE
===================================================== */

let darkMode =
  false;

let addressMarker =
  null;

let gpsMarker =
  null;

let followMode =
  false;

let followWatchId =
  null;

let lastGps =
  null;

let lastHeading =
  0;

let lastDriveMapUpdate =
  0;

let drawing =
  false;

let drawPoints =
  [];

let recording =
  false;

let recordingPaused =
  false;

let recordingWatchId =
  null;

let recordedPoints =
  [];

let hydrantsOn =
  false;

let blockCache =
  new Map();

let hydrantReloadTimer =
  null;

let driveHydrantReloadTime =
  0;


/* =====================================================
   HELPERS
===================================================== */

function status(text) {

  document
    .getElementById(
      "status"
    )
    .innerHTML =
      text;

}


function selectedColor() {

  return document
    .getElementById(
      "routeColor"
    )
    .value;

}


function blockRange(number) {

  const n =
    parseInt(
      number
    );


  if (
    Number.isNaN(
      n
    )
  ) {

    return null;

  }


  const start =

    Math.floor(
      n / 100
    ) * 100;


  return {

    start,

    end:
      start + 99,

    text:
      `${start}-${start + 99}`

  };

}


function distanceMetres(
  a,
  b
) {

  const R =
    6371000;


  const lat1 =
    a.lat *
    Math.PI / 180;


  const lat2 =
    b.lat *
    Math.PI / 180;


  const dLat =
    (
      b.lat -
      a.lat
    ) *
    Math.PI / 180;


  const dLng =
    (
      b.lng -
      a.lng
    ) *
    Math.PI / 180;


  const h =

    Math.sin(
      dLat / 2
    ) ** 2

    +

    Math.cos(
      lat1
    )

    *

    Math.cos(
      lat2
    )

    *

    Math.sin(
      dLng / 2
    ) ** 2;


  return (

    R * 2 *

    Math.atan2(

      Math.sqrt(h),

      Math.sqrt(
        1 - h
      )

    )

  );

}


function routeDistance(
  points
) {

  let total =
    0;


  for (

    let i = 1;

    i < points.length;

    i++

  ) {

    total +=

      distanceMetres(

        points[
          i - 1
        ],

        points[i]

      );

  }


  return total;

}


function calculateBearing(
  a,
  b
) {

  const lat1 =
    a.lat *
    Math.PI / 180;


  const lat2 =
    b.lat *
    Math.PI / 180;


  const dLng =
    (
      b.lng -
      a.lng
    ) *
    Math.PI / 180;


  const y =

    Math.sin(
      dLng
    )

    *

    Math.cos(
      lat2
    );


  const x =

    Math.cos(
      lat1
    )

    *

    Math.sin(
      lat2
    )

    -

    Math.sin(
      lat1
    )

    *

    Math.cos(
      lat2
    )

    *

    Math.cos(
      dLng
    );


  let bearing =

    Math.atan2(
      y,
      x
    )

    *

    180 /
    Math.PI;


  return (

    bearing +
    360

  ) % 360;

}


/* =====================================================
   SOFT NIGHT MODE
===================================================== */

function applyDayMap() {

  if (
    !map.getLayer(
      "osm"
    )
  ) {
    return;
  }


  map.setPaintProperty(
    "osm",
    "raster-brightness-min",
    0
  );


  map.setPaintProperty(
    "osm",
    "raster-brightness-max",
    1
  );


  map.setPaintProperty(
    "osm",
    "raster-saturation",
    0
  );


  map.setPaintProperty(
    "osm",
    "raster-contrast",
    0
  );

}


function applyNightMap() {

  if (
    !map.getLayer(
      "osm"
    )
  ) {
    return;
  }


  /*
  IMPORTANT:

  This keeps the SAME detailed OSM map.

  We only reduce brightness and saturation.

  This means small road names and house numbers
  remain much easier to see than on a full black map.
  */


  map.setPaintProperty(
    "osm",
    "raster-brightness-min",
    0.18
  );


  map.setPaintProperty(
    "osm",
    "raster-brightness-max",
    0.72
  );


  map.setPaintProperty(
    "osm",
    "raster-saturation",
    -0.35
  );


  map.setPaintProperty(
    "osm",
    "raster-contrast",
    0.08
  );

}


document
  .getElementById(
    "darkBtn"
  )
  .addEventListener(

    "click",

    () => {

      darkMode =
        !darkMode;


      document.body
        .classList.toggle(

          "dark",

          darkMode

        );


      if (
        darkMode
      ) {

        applyNightMap();

      } else {

        applyDayMap();

      }


      document
        .getElementById(
          "darkBtn"
        )
        .textContent =

          darkMode
            ? "☀️ Day"
            : "🌙 Night";


      status(

        darkMode
          ? "Night mode ON."
          : "Night mode OFF."

      );

    }

  );


/* =====================================================
   NORTH
===================================================== */

document
  .getElementById(
    "northBtn"
  )
  .addEventListener(

    "click",

    () => {

      map.easeTo({

        bearing:
          0,

        pitch:
          0,

        duration:
          400

      });

    }

  );


/* =====================================================
   BLOCK FINDER
===================================================== */

async function reverseGeocode(
  lat,
  lng
) {

  const key =

    lat.toFixed(5) +

    "," +

    lng.toFixed(5);


  if (

    blockCache.has(
      key
    )

  ) {

    return blockCache.get(
      key
    );

  }


  try {

    const url =

      "https://nominatim.openstreetmap.org/reverse" +

      "?format=jsonv2" +

      "&addressdetails=1" +

      "&zoom=18" +

      "&lat=" +
      lat +

      "&lon=" +
      lng;


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    const a =
      data.address ||
      {};


    const result = {

      road:

        a.road ||

        a.street ||

        a.residential ||

        a.pedestrian ||

        a.service ||

        "Street unknown",


      house:

        a.house_number ||

        null

    };


    blockCache.set(

      key,

      result

    );


    return result;

  } catch {

    return {

      road:
        "Street unknown",

      house:
        null

    };

  }

}


async function findNearbyBlock(
  lat,
  lng,
  road
) {

  if (

    !road ||

    road ===
    "Street unknown"

  ) {

    return null;

  }


  const controller =
    new AbortController();


  const timer =
    setTimeout(

      () =>
        controller.abort(),

      3500

    );


  try {

    const safeRoad =

      road.replace(

        /"/g,

        '\\"'

      );


    const query = `

[out:json][timeout:3];

(

node
["addr:housenumber"]
["addr:street"="${safeRoad}"]
(around:220,${lat},${lng});

way
["addr:housenumber"]
["addr:street"="${safeRoad}"]
(around:220,${lat},${lng});

);

out center tags 30;

`;


    const url =

      "https://overpass-api.de/api/interpreter?data=" +

      encodeURIComponent(
        query
      );


    const response =

      await fetch(

        url,

        {

          signal:
            controller.signal

        }

      );


    const data =
      await response.json();


    clearTimeout(
      timer
    );


    const numbers =
      [];


    for (

      const item

      of data.elements

    ) {

      const num =

        parseInt(

          item.tags?.[
            "addr:housenumber"
          ]

        );


      if (

        !Number.isNaN(
          num
        )

      ) {

        numbers.push(
          num
        );

      }

    }


    if (
      !numbers.length
    ) {

      return null;

    }


    numbers.sort(
      (a,b) =>
        a-b
    );


    const middle =

      numbers[
        Math.floor(
          numbers.length /
          2
        )
      ];


    return blockRange(
      middle
    );

  } catch {

    clearTimeout(
      timer
    );


    return null;

  }

}


async function showBlock(
  lat,
  lng
) {

  status(
    "Finding street and block..."
  );


  const info =

    await reverseGeocode(

      lat,

      lng

    );


  let block =

    info.house

      ? blockRange(
          info.house
        )

      : null;


  if (
    !block
  ) {

    block =

      await findNearbyBlock(

        lat,

        lng,

        info.road

      );

  }


  const blockText =

    block

      ? `${block.text} ${info.road}`

      : `Block unknown • ${info.road}`;


  status(

    `Street: ${info.road}<br>` +

    `Block: ${blockText}` +

    (

      info.house

        ? `<br>Nearest address: ${info.house}`

        : ""

    )

  );


  if (
    addressMarker
  ) {

    addressMarker.remove();

  }


  const box =

    document.createElement(
      "div"
    );


  box.className =
    "address-marker";


  box.innerHTML =

    (

      info.house

        ? `${info.house}<br>`

        : ""

    )

    +

    blockText

    +

    "<br><small>Tap to close</small>";


  addressMarker =

    new maplibregl.Marker({

      element:
        box,

      anchor:
        "bottom"

    })

    .setLngLat([

      lng,

      lat

    ])

    .addTo(
      map
    );


  box.addEventListener(

    "click",

    event => {

      event.stopPropagation();


      addressMarker?.remove();


      addressMarker =
        null;

    }

  );

}


/* =====================================================
   MAP CLICK
===================================================== */

map.on(

  "click",

  event => {

    if (
      drawing
    ) {

      addDrawPoint(

        event.lngLat.lat,

        event.lngLat.lng

      );


      return;

    }


    showBlock(

      event.lngLat.lat,

      event.lngLat.lng

    );

  }

);


/* =====================================================
   SEARCH
===================================================== */

async function searchPlace() {

  const text =

    document
      .getElementById(
        "searchBox"
      )
      .value
      .trim();


  if (
    !text
  ) {
    return;
  }


  status(
    "Searching..."
  );


  try {

    const url =

      "https://nominatim.openstreetmap.org/search" +

      "?format=jsonv2" +

      "&limit=1" +

      "&q=" +

      encodeURIComponent(

        text +

        ", Saskatoon, Saskatchewan, Canada"

      );


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    if (
      !data.length
    ) {

      status(
        "Address not found."
      );


      return;

    }


    const lat =

      Number(
        data[0].lat
      );


    const lng =

      Number(
        data[0].lon
      );


    map.flyTo({

      center: [
        lng,
        lat
      ],

      zoom:
        18,

      duration:
        650

    });


    showBlock(

      lat,

      lng

    );

  } catch {

    status(
      "Search failed."
    );

  }

}


document
  .getElementById(
    "searchBtn"
  )
  .addEventListener(

    "click",

    searchPlace

  );


document
  .getElementById(
    "searchBox"
  )
  .addEventListener(

    "keydown",

    event => {

      if (

        event.key ===
        "Enter"

      ) {

        searchPlace();

      }

    }

  );


/* =====================================================

function createGpsArrow() {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "drive-arrow";


  const arrow =
    document.createElement(
      "div"
    );


  arrow.className =
    "drive-arrow-inner";


  wrapper.appendChild(
    arrow
  );


  return wrapper;

}


function updateGpsMarker(
  lng,
  lat,
  heading
) {

  if (
    !gpsMarker
  ) {

    gpsMarker =

      new maplibregl.Marker({

        element:
          createGpsArrow(),

        rotationAlignment:
          "map",

        pitchAlignment:
          "map"

      })

      .setLngLat([

        lng,

        lat

      ])

      .addTo(
        map
      );

  }


  gpsMarker

    .setLngLat([

      lng,

      lat

    ])

    .setRotation(

      heading ||
      0

    );

}

function getAccurateGPS() {

  if (
    !navigator.geolocation
  ) {

    status(
      "GPS not supported."
    );


    return;

  }


  status(
    "Getting accurate GPS..."
  );


  let best =
    null;


  let readings =
    0;


  const watcher =

    navigator.geolocation
      .watchPosition(

        position => {

          readings++;


          if (

            !best ||

            position.coords.accuracy <

            best.coords.accuracy

          ) {

            best =
              position;

          }


          status(

            `Improving GPS...<br>` +

            `Accuracy ±${Math.round(
              position.coords.accuracy
            )} m`

          );


          if (

            position.coords.accuracy <=
            8

            ||

            readings >=
            8

          ) {

            navigator.geolocation
              .clearWatch(
                watcher
              );


            const lat =
              best.coords.latitude;


            const lng =
              best.coords.longitude;


            updateGpsMarker(

              lng,

              lat,

              0

            );


            map.flyTo({

              center: [
                lng,
                lat
              ],

              zoom:
                18,

              duration:
                500

            });


            showBlock(

              lat,

              lng

            );

          }

        },


        () => {

          status(
            "Please allow precise location."
          );

        },


        {

          enableHighAccuracy:
            true,

          maximumAge:
            0,

          timeout:
            15000

        }

      );

}

function startDrive() {

  if (
    !navigator.geolocation
  ) {

    status(
      "GPS not supported."
    );


    return;

  }


  followMode =
    true;


  lastGps =
    null;


  lastHeading =
    map.getBearing() ||
    0;


  lastDriveMapUpdate =
    0;


  setMenu(
    false
  );


  document
    .getElementById(
      "followBtn"
    )
    .classList.add(
      "active"
    );


  document
    .getElementById(
      "followBtn"
    )
    .textContent =
      "🚗 Stop Drive";


  document
    .getElementById(
      "driveInfo"
    )
    .style.display =
      "block";


  status(
    "Drive mode started."
  );


  followWatchId =

    navigator.geolocation
      .watchPosition(

        position => {

          if (
            !followMode
          ) {

            return;

          }


          const now =
            Date.now();


          const lat =
            position.coords.latitude;


          const lng =
            position.coords.longitude;


          const accuracy =
            position.coords.accuracy;


          const speed =
            position.coords.speed;


          let heading =
            position.coords.heading;


          if (

            (

              heading == null

              ||

              Number.isNaN(
                heading
              )

            )

            &&

            lastGps

          ) {

            const moved =

              distanceMetres(

                lastGps,

                {
                  lat,
                  lng
                }

              );


            if (
              moved >= 4
            ) {

              heading =

                calculateBearing(

                  lastGps,

                  {
                    lat,
                    lng
                  }

                );

            }

          }


          if (

            heading != null

            &&

            !Number.isNaN(
              heading
            )

          ) {

            const difference =

              (

                (

                  heading -

                  lastHeading +

                  540

                ) % 360

              )

              - 180;


            lastHeading =

              (

                lastHeading +

                difference *
                0.30 +

                360

              ) % 360;

          }


          /*
          The arrow stays facing forward.
          The map rotates underneath it.
          */

          updateGpsMarker(

            lng,

            lat,

            0

          );


          /*
          Update map about once per second
          to stay stable on phones.
          */

          if (

            now -

            lastDriveMapUpdate >

            900

          ) {

            lastDriveMapUpdate =
              now;


            let zoom =
              17;


            if (
              speed != null
            ) {

              const kmh =
                speed * 3.6;


              if (
                kmh > 80
              ) {

                zoom =
                  15.8;

              } else if (
                kmh > 50
              ) {

                zoom =
                  16.2;

              } else if (
                kmh > 25
              ) {

                zoom =
                  16.6;

              }

            }


            map.jumpTo({

              center: [
                lng,
                lat
              ],

              bearing:
                lastHeading,

              zoom,

              pitch:
                0

            });

          }


          let speedKmh =
            null;


          if (
            speed != null
          ) {

            speedKmh =

              Math.max(

                0,

                speed *
                3.6

              );

          }


          document
            .getElementById(
              "driveInfo"
            )
            .innerHTML =

              (

                speedKmh == null

                  ? ""

                  : `${speedKmh.toFixed(0)} km/h • `

              )

              +

              `GPS ±${Math.round(
                accuracy
              )} m`;


          /*
          Do not constantly reload hydrants.

          Only approximately every 15 seconds
          while driving.
          */

          if (

            hydrantsOn

            &&

            now -

            driveHydrantReloadTime >

            15000

          ) {

            driveHydrantReloadTime =
              now;


            loadHydrants();

          }


          lastGps = {

            lat,

            lng

          };

        },


        error => {

          console.error(

            "Drive GPS error:",

            error

          );


          status(

            "Please allow precise location."

          );


          stopDrive();

        },


        {

          enableHighAccuracy:
            true,

          maximumAge:
            500,

          timeout:
            15000

        }

      );

}


function stopDrive() {

  followMode =
    false;


  if (
    followWatchId != null
  ) {

    navigator.geolocation
      .clearWatch(
        followWatchId
      );


    followWatchId =
      null;

  }


  document
    .getElementById(
      "followBtn"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "followBtn"
    )
    .textContent =
      "🚗 Start Drive";


  document
    .getElementById(
      "driveInfo"
    )
    .style.display =
      "none";


  status(
    "Drive mode stopped."
  );

}


/* =====================================================
   ROUTE LINE HELPER
===================================================== */

function setLine(
  id,
  points,
  color,
  opacity = .5,
  width = 7,
  dash = null
) {

  if (
    points.length <
    2
  ) {

    return;

  }


  const data = {

    type:
      "Feature",

    geometry: {

      type:
        "LineString",

      coordinates:

        points.map(

          point => [

            point.lng,

            point.lat

          ]

        )

    }

  };


  if (
    map.getSource(
      id
    )
  ) {

    map
      .getSource(
        id
      )
      .setData(
        data
      );


    return;

  }


  map.addSource(

    id,

    {

      type:
        "geojson",

      data

    }

  );


  const paint = {

    "line-color":
      color,

    "line-width":
      width,

    "line-opacity":
      opacity

  };


  if (
    dash
  ) {

    paint[
      "line-dasharray"
    ] =
      dash;

  }


  map.addLayer({

    id,

    type:
      "line",

    source:
      id,

    layout: {

      "line-join":
        "round",

      "line-cap":
        "round"

    },

    paint

  });

}


function removeLine(
  id
) {

  if (
    map.getLayer(
      id
    )
  ) {

    map.removeLayer(
      id
    );

  }


  if (
    map.getSource(
      id
    )
  ) {

    map.removeSource(
      id
    );

  }

}

function startRecording() {

  if (
    !navigator.geolocation
  ) {

    status(
      "GPS not supported."
    );


    return;

  }


  recordedPoints =
    [];


  recording =
    true;


  recordingPaused =
    false;


  removeLine(
    "recordRoute"
  );


  setMenu(
    false
  );


  recordingWatchId =

    navigator.geolocation
      .watchPosition(

        position => {

          if (

            !recording

            ||

            recordingPaused

          ) {

            return;

          }


          if (

            position.coords.accuracy >

            45

          ) {

            return;

          }


          const point = {

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          };


          const previous =

            recordedPoints[
              recordedPoints.length -
              1
            ];


          if (
            previous
          ) {

            const moved =

              distanceMetres(

                previous,

                point

              );


            if (
              moved <
              1.5
            ) {

              return;

            }

          }


          recordedPoints.push(
            point
          );


          setLine(

            "recordRoute",

            recordedPoints,

            selectedColor(),

            .55,

            7

          );


          status(

            `Recording • ${(
              routeDistance(
                recordedPoints
              ) / 1000
            ).toFixed(2)} km`

            +

            `<br>GPS ±${Math.round(
              position.coords.accuracy
            )} m`

          );

        },


        () => {

          status(
            "Recording GPS error."
          );

        },


        {

          enableHighAccuracy:
            true,

          maximumAge:
            0,

          timeout:
            15000

        }

      );


  status(
    "Recording started."
  );

}

function getRoutes() {

  try {

    return JSON.parse(

      localStorage.getItem(
        "faranRoutes"
      )

      ||

      "[]"

    );

  } catch {

    return [];

  }

}


function saveRoute(
  name,
  points,
  color
) {

  const routes =
    getRoutes();


  routes.push({

    id:
      Date.now(),

    name,

    color,

    date:
      new Date()
        .toLocaleString(),

    points

  });


  localStorage.setItem(

    "faranRoutes",

    JSON.stringify(
      routes
    )

  );


  refreshRoutes();

}


function refreshRoutes() {

  const selector =

    document.getElementById(
      "savedRoutes"
    );


  selector.innerHTML =

    '<option value="">Select old route</option>';


  getRoutes()
    .forEach(

      route => {

        const option =

          document.createElement(
            "option"
          );


        option.value =
          route.id;


        option.textContent =

          route.name +

          " • " +

          route.date;


        selector.appendChild(
          option
        );

      }

    );

async function loadHydrants() {

  if (
    !hydrantsOn
  ) {

    return;

  }


  status(
    "Loading Saskatoon hydrants..."
  );


  const bounds =
    map.getBounds();


  const geometry = {

    xmin:
      bounds.getWest(),

    ymin:
      bounds.getSouth(),

    xmax:
      bounds.getEast(),

    ymax:
      bounds.getNorth(),

    spatialReference: {
      wkid:
        4326
    }

  };


  const params =

    new URLSearchParams({

      where:
        "1=1",

      geometry:
        JSON.stringify(
          geometry
        ),

      geometryType:
        "esriGeometryEnvelope",

      spatialRel:
        "esriSpatialRelIntersects",

      inSR:
        "4326",

      outSR:
        "4326",

      outFields:
        "*",

      returnGeometry:
        "true",

      f:
        "geojson"

    });


  try {

    const response =

      await fetch(

        HYDRANT_SERVICE +

        "?" +

        params.toString()

      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Hydrant request failed"
      );

    }


    const data =
      await response.json();


    if (
      data.error
    ) {

      throw new Error(

        data.error.message

        ||

        "ArcGIS error"

      );

    }


    const features =
      data.features ||
      [];


    if (

      map.getSource(
        "hydrants"
      )

    ) {

      map
        .getSource(
          "hydrants"
        )
        .setData(
          data
        );

    } else {

      map.addSource(

        "hydrants",

        {

          type:
            "geojson",

          data

        }

      );


      map.addLayer({

        id:
          "hydrant-points",

        type:
          "circle",

        source:
          "hydrants",

        paint: {

          "circle-radius":

            [

              "interpolate",

              ["linear"],

              ["zoom"],

              12, 3,

              14, 4,

              16, 6,

              18, 8

            ],


          "circle-color":
            "#e53935",


          "circle-stroke-color":
            "#ffffff",


          "circle-stroke-width":
            1.8,


          "circle-opacity":
            0.98

        }

      });


      map.on(

        "click",

        "hydrant-points",

        event => {

          event.originalEvent
            .stopPropagation();


          const feature =

            event.features?.[
              0
            ];


          if (
            !feature
          ) {

            return;

          }


          const p =
            feature.properties ||
            {};


          const coordinates =

            feature.geometry
              .coordinates
              .slice();


          const node =

            p.WMNODENO

            ??

            p.WM_NODE_NO

            ??

            p.NODE_NO

            ??

            p.FACILITYID

            ??

            "Unknown";


          const statusValue =

            p.STATUS

            ??

            p.Status

            ??

            "Unknown";


          const typeValue =

            p.HYDRANT_TYPE

            ??

            p.HYDRANTTYPE

            ??

            p.TYPE

            ??

            "Unknown";


          const yearValue =

            p.YEAR_CONSTRUCTED

            ??

            p.YEARCONSTRUCTED

            ??

            p.INSTALL_YEAR

            ??

            "Unknown";


          new maplibregl.Popup({

            offset:
              12,

            closeButton:
              true

          })

          .setLngLat(
            coordinates
          )

          .setHTML(

            `<strong>🔥 Fire Hydrant</strong><br><br>`

            +

            `Node #: ${node}<br>`

            +

            `Status: ${statusValue}<br>`

            +

            `Type: ${typeValue}<br>`

            +

            `Year: ${yearValue}<br><br>`

            +

            `<a href="${REPORT_HYDRANT_URL}" target="_blank" rel="noopener">Report Hydrant Issue</a>`

          )

          .addTo(
            map
          );

        }

      );


      map.on(

        "mouseenter",

        "hydrant-points",

        () => {

          map
            .getCanvas()
            .style.cursor =
              "pointer";

        }

      );


      map.on(

        "mouseleave",

        "hydrant-points",

        () => {

          map
            .getCanvas()
            .style.cursor =
              "";

        }

      );

    }


    status(

      `${features.length} hydrants loaded in this map area.`

    );

  } catch (
    error
  ) {

    console.error(

      "Hydrant error:",

      error

    );


    status(

      "Could not load hydrants. Zoom into Saskatoon and try again."

    );

  }

}


/* Hydrant refresh after map moves,
   but not constantly during drive mode */

map.on(

  "moveend",

  () => {

    if (

      !hydrantsOn

      ||

      followMode

    ) {

      return;

    }


    clearTimeout(
      hydrantReloadTimer
    );


    hydrantReloadTimer =

      setTimeout(

        loadHydrants,

        700

      );

  }

);


/* =====================================================
   STARTUP
===================================================== */

map.on(

  "load",

  () => {

    refreshRoutes();


    applyDayMap();


    status(
      "Map ready."
    );


    setTimeout(

      () => {

        if (
          navigator.geolocation
        ) {

          navigator.geolocation
            .getCurrentPosition(

              position => {

                const lat =
                  position.coords.latitude;


                const lng =
                  position.coords.longitude;


                updateGpsMarker(

                  lng,

                  lat,

                  0

                );


                map.flyTo({

                  center: [

                    lng,

                    lat

                  ],

                  zoom:
                    16,

                  duration:
                    600

                });

              },


              () => {

                /*
                Location permission may not
                have been given yet.
                User can press GPS.
                */

              },


              {

                enableHighAccuracy:
                  true,

                timeout:
                  8000,

                maximumAge:
                  30000

              }

            );

        }

      },

      700

    );

  }

);

</script>

</body>
</html>
