<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saskatoon Block Finder</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #app, #map {
      position: absolute;
      inset: 0;
    }

    /* Make map transition smoothly between day/night */
    .maplibregl-canvas {
      transition: filter .22s ease;
      will-change: transform, filter;
    }

    /* Night mode keeps the SAME detailed OSM tiles, but inverts them.
       This makes dark street labels/house numbers become light and readable. */
    body.dark .maplibregl-canvas {
      filter:
        invert(.82)
        hue-rotate(180deg)
        brightness(.82)
        contrast(.96)
        saturate(.72);
    }

    /* Built-in zoom buttons always stay readable */
    .maplibregl-ctrl-group {
      background: #fff !important;
      border-radius: 10px !important;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.35) !important;
    }

    .maplibregl-ctrl-group button {
      background: #fff !important;
    }

    .maplibregl-ctrl-group button:hover {
      background: #eee !important;
    }

    .maplibregl-ctrl-icon {
      filter: none !important;
      opacity: 1 !important;
    }

    /* Three-dot menu */
    #menuButton {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 50;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.96);
      color: #111;
      font-size: 27px;
      font-weight: 700;
      box-shadow: 0 2px 9px rgba(0,0,0,.35);
      cursor: pointer;
    }

    body.dark #menuButton {
      background: #f4f4f4;
      color: #111;
    }

    /* Main controls */
    #toolbar {
      position: absolute;
      top: 68px;
      left: 10px;
      z-index: 45;
      width: min(365px, calc(100vw - 20px));
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      transition: opacity .2s ease, transform .2s ease;
    }

    #toolbar.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-110%);
    }

    #toolbar h2 {
      margin: 2px 0 9px;
      font-size: 19px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 7px;
    }

    button, select, input {
      box-sizing: border-box;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #aaa;
      border-radius: 8px;
      background: #fff;
      font-size: 15px;
    }

    button {
      cursor: pointer;
    }

    button.active {
      background: #1769aa;
      color: #fff;
    }

    input {
      width: 100%;
    }

    select {
      max-width: 100%;
    }

    #status {
      margin-top: 5px;
      padding: 9px;
      border-radius: 8px;
      background: #fff3c4;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    body.dark #toolbar {
      background: rgba(24,24,24,.96);
      color: #fff;
    }

    body.dark button,
    body.dark select,
    body.dark input {
      background: #333;
      color: #fff;
      border-color: #666;
    }

    body.dark #status {
      background: #292929;
      color: #fff;
    }

    /* Custom 4-direction compass */
    #compassRose {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 60;
      width: 82px;
      height: 82px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: rgba(255,255,255,.96);
      box-shadow: 0 2px 9px rgba(0,0,0,.35);
      cursor: pointer;
      overflow: hidden;
    }

    #compassDial {
      position: absolute;
      inset: 0;
      transition: transform .12s linear;
    }

    .dir {
      position: absolute;
      font-weight: 800;
      font-size: 16px;
      line-height: 1;
      color: #111;
      user-select: none;
    }

    .dir.n {
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      color: #d71920;
    }

    .dir.s {
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
    }

    .dir.e {
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .dir.w {
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #111;
    }

    .compass-arrow {
      position: absolute;
      top: 21px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 13px solid #d71920;
    }

    body.dark #compassRose {
      background: rgba(245,245,245,.97);
    }

    /* GPS / driving arrow */
    .drive-arrow {
      width: 40px;
      will-change: transform;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drive-arrow-inner {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 35px solid #1976d2;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.75));
    }

    /* Clicked address popup */
    .address-marker {
      min-width: 125px;
      max-width: 205px;
      padding: 7px 9px;
      border: 2px solid #111;
      border-radius: 9px;
      background: rgba(255,255,255,.98);
      color: #111;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 7px rgba(0,0,0,.4);
      cursor: pointer;
    }

    /* Drive information */
    #driveInfo {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      z-index: 40;
      display: none;
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(20,20,20,.90);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    #credit {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,.92);
      color: #222;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    body.dark #credit {
      background: rgba(20,20,20,.90);
      color: #fff;
    }

    @media (max-width: 650px) {
      #compassRose {
        width: 72px;
        height: 72px;
      }

      .dir {
        font-size: 14px;
      }

      #toolbar {
        width: min(350px, calc(100vw - 20px));
      }
    }
  
/* Keep MapLibre zoom buttons clear of the custom compass */
.maplibregl-ctrl-bottom-right {
  right: 8px;
  bottom: 34px;
}

.maplibregl-ctrl-bottom-right .maplibregl-ctrl-group {
  margin: 0 0 8px 0 !important;
}

</style>
</head>

<body>
<div id="app">
  <div id="map"></div>

  <button id="menuButton" aria-label="Open menu">⋮</button>

  <button id="compassRose" aria-label="Compass. Tap to reset north" title="Tap to reset North">
    <div id="compassDial">
      <span class="dir n">N</span>
      <span class="dir e">E</span>
      <span class="dir s">S</span>
      <span class="dir w">W</span>
      <span class="compass-arrow"></span>
      <span class="compass-center"></span>
    </div>
  </button>

  <div id="toolbar">
    <h2>Saskatoon Block Finder</h2>

    <div class="controls">
      <button id="followBtn">🚗 Start Drive</button>
      <button id="gpsBtn">📍 GPS</button>
      <button id="darkBtn">🌙 Night</button>
</div>

    <div class="controls">
      <button id="hydrantBtn">🔥 Hydrants</button>
    </div>

    <div class="controls">
      <button id="importGpxBtn">📂 Import GPX</button>
      <input id="gpxFileInput" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden>
    </div>

    <div class="controls">
      <button id="drawBtn">✏️ Draw</button>
      <button id="finishDrawBtn">✅ Finish + Save</button>
      <button id="clearDrawBtn">🗑 Clear</button>
    </div>

    <div class="controls">
      <select id="routeColor">
        <option value="#2196f3">Blue</option>
        <option value="#f44336">Red</option>
        <option value="#4caf50">Green</option>
        <option value="#ff9800">Orange</option>
        <option value="#9c27b0">Purple</option>
        <option value="#00bcd4">Cyan</option>
      </select>
    </div>

    <div class="controls">
      <button id="recordBtn">🔴 Record</button>
      <button id="pauseBtn">⏸ Pause</button>
      <button id="resumeBtn">▶ Resume</button>
      <button id="stopBtn">⏹ Stop</button>
      <button id="saveBtn">💾 Save</button>
    </div>

    <div class="controls">
      <select id="savedRoutes">
        <option value="">Select old route</option>
      </select>
      <button id="loadRouteBtn">Show Route</button>
      <button id="hideRouteBtn">Hide Route</button>
      <button id="deleteRouteBtn">Delete Route</button>
    </div>

    <div class="controls">
      <input id="searchBox" placeholder="Search Saskatoon street/address">
      <button id="searchBtn">Search</button>
    </div>

    <div id="status">Tap a street to find its block.</div>
  </div>

  <div id="driveInfo"></div>
  <div id="credit">Saskatoon Block Finder • Made by Faran</div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<script>
const OSM_TILES = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";

const HYDRANT_SERVICE =
  "https://services.arcgis.com/p3UBboyC0NH1uCie/ArcGIS/rest/services/Prod_SaskatoonWater/FeatureServer/5/query";

const REPORT_HYDRANT_URL =
  "https://service.saskatoon.ca/site/saskatoon/request/cos_report_firehydrantissue";

/* =========================
   MAP
========================= */

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: [OSM_TILES],
        tileSize: 256,
        attribution: "© OpenStreetMap contributors"
      }
    },
    layers: [
      {
        id: "osm",
        type: "raster",
        source: "osm"
      }
    ]
  },
  center: [-106.6700, 52.1332],
  zoom: 12,
  bearing: 0,
  pitch: 0,
  dragRotate: true,
  touchPitch: false
});

/* Keep zoom buttons, use our own 4-direction compass */
map.addControl(
  new maplibregl.NavigationControl({
    showCompass: false,
    showZoom: true
  }),
  "bottom-right"
);

/* =========================
   ELEMENTS / STATE
========================= */

const toolbar = document.getElementById("toolbar");
const menuButton = document.getElementById("menuButton");
const compassRose = document.getElementById("compassRose");
const compassDial = document.getElementById("compassDial");

let menuOpen = true;
let darkMode = false;
let addressMarker = null;
let gpsMarker = null;

let followMode = false;
let followWatchId = null;
let lastGps = null;
let lastHeading = 0;
let lastDriveMapUpdate = 0;

let drawing = false;
let drawPoints = [];

let recording = false;
let recordingPaused = false;
let recordingWatchId = null;
let recordedPoints = [];

let hydrantsOn = false;
let blockCache = new Map();
let hydrantReloadTimer = null;
let driveHydrantReloadTime = 0;

/* =========================
   BASIC HELPERS
========================= */

function status(text) {
  document.getElementById("status").innerHTML = text;
}

function selectedColor() {
  return document.getElementById("routeColor").value;
}

function setMenu(open) {
  menuOpen = open;
  toolbar.classList.toggle("hidden", !open);
  menuButton.textContent = open ? "×" : "⋮";
  menuButton.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  setTimeout(() => map.resize(), 220);
}

menuButton.addEventListener("click", () => setMenu(!menuOpen));

if (window.matchMedia("(max-width: 650px)").matches) {
  setMenu(false);
}

function blockRange(number) {
  const n = parseInt(number);
  if (Number.isNaN(n)) return null;

  const start = Math.floor(n / 100) * 100;
  return {
    start,
    end: start + 99,
    text: `${start}-${start + 99}`
  };
}

function distanceMetres(a, b) {
  const R = 6371000;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;

  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) *
    Math.cos(lat2) *
    Math.sin(dLng / 2) ** 2;

  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function routeDistance(points) {
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    total += distanceMetres(points[i - 1], points[i]);
  }
  return total;
}

function calculateBearing(a, b) {
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;

  const y = Math.sin(dLng) * Math.cos(lat2);
  const x =
    Math.cos(lat1) * Math.sin(lat2) -
    Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);

  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

/* =========================
   COMPASS N / E / S / W
========================= */

function updateCompass() {
  const bearing = map.getBearing() || 0;

  /* Dial rotates opposite the map so directions remain geographically correct */
  compassDial.style.transform = `rotate(${-bearing}deg)`;
}

map.on("rotate", updateCompass);
map.on("move", updateCompass);

function resetNorth() {
  map.easeTo({
    bearing: 0,
    pitch: 0,
    duration: 350
  });
}

compassRose.addEventListener("click", resetNorth);

/* =========================
   NIGHT MODE
========================= */

document.getElementById("darkBtn").addEventListener("click", () => {
  darkMode = !darkMode;
  document.body.classList.toggle("dark", darkMode);

  document.getElementById("darkBtn").textContent =
    darkMode ? "☀️ Day" : "🌙 Night";

  status(
    darkMode
      ? "Night mode ON. Street names and map numbers stay light and readable."
      : "Night mode OFF."
  );
});

/* =========================
   BLOCK / ADDRESS FINDER
========================= */

async function reverseGeocode(lat, lng) {
  const key = `${lat.toFixed(5)},${lng.toFixed(5)}`;

  if (blockCache.has(key)) {
    return blockCache.get(key);
  }

  try {
    const url =
      "https://nominatim.openstreetmap.org/reverse" +
      "?format=jsonv2" +
      "&addressdetails=1" +
      "&zoom=18" +
      "&lat=" + lat +
      "&lon=" + lng;

    const response = await fetch(url);
    const data = await response.json();
    const a = data.address || {};

    const result = {
      road:
        a.road ||
        a.street ||
        a.residential ||
        a.pedestrian ||
        a.service ||
        "Street unknown",
      house: a.house_number || null
    };

    blockCache.set(key, result);
    return result;
  } catch {
    return {
      road: "Street unknown",
      house: null
    };
  }
}

async function findNearbyBlock(lat, lng, road) {
  if (!road || road === "Street unknown") return null;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3500);

  try {
    const safeRoad = road.replace(/"/g, '\\"');

    const query = `
[out:json][timeout:3];
(
  node["addr:housenumber"]["addr:street"="${safeRoad}"](around:220,${lat},${lng});
  way["addr:housenumber"]["addr:street"="${safeRoad}"](around:220,${lat},${lng});
);
out center tags 30;
`;

    const url =
      "https://overpass-api.de/api/interpreter?data=" +
      encodeURIComponent(query);

    const response = await fetch(url, {
      signal: controller.signal
    });

    const data = await response.json();
    clearTimeout(timer);

    const numbers = [];

    for (const item of data.elements || []) {
      const num = parseInt(item.tags?.["addr:housenumber"]);
      if (!Number.isNaN(num)) {
        numbers.push(num);
      }
    }

    if (!numbers.length) return null;

    numbers.sort((a, b) => a - b);

    return blockRange(
      numbers[Math.floor(numbers.length / 2)]
    );
  } catch {
    clearTimeout(timer);
    return null;
  }
}

async function showBlock(lat, lng) {
  status("Finding street and block...");

  const info = await reverseGeocode(lat, lng);

  let block =
    info.house
      ? blockRange(info.house)
      : null;

  if (!block) {
    block = await findNearbyBlock(lat, lng, info.road);
  }

  const blockText =
    block
      ? `${block.text} ${info.road}`
      : `Block unknown • ${info.road}`;

  status(
    `Street: ${info.road}<br>` +
    `Block: ${blockText}` +
    (info.house ? `<br>Nearest address: ${info.house}` : "")
  );

  if (addressMarker) {
    addressMarker.remove();
  }

  const box = document.createElement("div");
  box.className = "address-marker";
  box.innerHTML =
    (info.house ? `${info.house}<br>` : "") +
    blockText +
    "<br><small>Tap to close</small>";

  addressMarker =
    new maplibregl.Marker({
      element: box,
      anchor: "bottom"
    })
    .setLngLat([lng, lat])
    .addTo(map);

  box.addEventListener("click", event => {
    event.stopPropagation();

    if (addressMarker) {
      addressMarker.remove();
      addressMarker = null;
    }
  });
}

map.on("click", event => {
  if (drawing) {
    addDrawPoint(
      event.lngLat.lat,
      event.lngLat.lng
    );
    return;
  }

  showBlock(
    event.lngLat.lat,
    event.lngLat.lng
  );
});

/* =========================
   SEARCH
========================= */

async function searchPlace() {
  const text =
    document.getElementById("searchBox").value.trim();

  if (!text) return;

  status("Searching...");

  try {
    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(
        text + ", Saskatoon, Saskatchewan, Canada"
      );

    const response = await fetch(url);
    const data = await response.json();

    if (!data.length) {
      status("Address not found.");
      return;
    }

    const lat = Number(data[0].lat);
    const lng = Number(data[0].lon);

    map.flyTo({
      center: [lng, lat],
      zoom: 18,
      duration: 650
    });

    showBlock(lat, lng);
  } catch {
    status("Search failed.");
  }
}

document.getElementById("searchBtn").addEventListener("click", searchPlace);

document.getElementById("searchBox").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    searchPlace();
  }
});

/* =========================
   GPS ARROW
========================= */

function createGpsArrow() {
  const wrapper = document.createElement("div");
  wrapper.className = "drive-arrow";

  const arrow = document.createElement("div");
  arrow.className = "drive-arrow-inner";

  wrapper.appendChild(arrow);
  return wrapper;
}

function updateGpsMarker(lng, lat, heading) {
  if (!gpsMarker) {
    gpsMarker =
      new maplibregl.Marker({
        element: createGpsArrow(),
        rotationAlignment: "viewport",
        pitchAlignment: "viewport"
      })
      .setLngLat([lng, lat])
      .addTo(map);
  }

  gpsMarker
    .setLngLat([lng, lat])
    .setRotation(heading || 0);
}

let gpsMarkerAnimation = null;
let gpsDisplayPosition = null;

function smoothGpsMarkerTo(lng, lat, duration = 850) {
  if (!gpsMarker) {
    updateGpsMarker(lng, lat, 0);
    gpsDisplayPosition = { lng, lat };
    return;
  }

  const start = gpsDisplayPosition || {
    lng: gpsMarker.getLngLat().lng,
    lat: gpsMarker.getLngLat().lat
  };

  const target = { lng, lat };
  const started = performance.now();

  if (gpsMarkerAnimation) {
    cancelAnimationFrame(gpsMarkerAnimation);
  }

  function frame(now) {
    const raw = Math.min(1, (now - started) / duration);
    const t = 1 - Math.pow(1 - raw, 3);

    const currentLng = start.lng + (target.lng - start.lng) * t;
    const currentLat = start.lat + (target.lat - start.lat) * t;

    gpsMarker.setLngLat([currentLng, currentLat]).setRotation(0);
    gpsDisplayPosition = { lng: currentLng, lat: currentLat };

    if (raw < 1 && followMode) {
      gpsMarkerAnimation = requestAnimationFrame(frame);
    } else {
      gpsDisplayPosition = target;
      gpsMarkerAnimation = null;
    }
  }

  gpsMarkerAnimation = requestAnimationFrame(frame);
}

/* =========================
   ACCURATE GPS BUTTON
========================= */

document.getElementById("gpsBtn").addEventListener("click", getAccurateGPS);

function getAccurateGPS() {
  if (!navigator.geolocation) {
    status("GPS not supported.");
    return;
  }

  status("Getting accurate GPS...");

  let best = null;
  let readings = 0;

  const watcher =
    navigator.geolocation.watchPosition(
      position => {
        readings++;

        if (
          !best ||
          position.coords.accuracy <
          best.coords.accuracy
        ) {
          best = position;
        }

        status(
          `Improving GPS...<br>` +
          `Accuracy ±${Math.round(position.coords.accuracy)} m`
        );

        if (
          position.coords.accuracy <= 8 ||
          readings >= 8
        ) {
          navigator.geolocation.clearWatch(watcher);

          const lat = best.coords.latitude;
          const lng = best.coords.longitude;

          updateGpsMarker(lng, lat, 0);

          map.flyTo({
            center: [lng, lat],
            zoom: 18,
            duration: 500
          });

          showBlock(lat, lng);
        }
      },
      () => {
        status("Please allow precise location.");
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );
}

/* =========================
   DRIVE MODE
========================= */

document.getElementById("followBtn").addEventListener("click", () => {
  if (followMode) {
    stopDrive();
  } else {
    startDrive();
  }
});

function startDrive() {
  if (!navigator.geolocation) {
    status("GPS not supported.");
    return;
  }

  if (followWatchId != null) {
    navigator.geolocation.clearWatch(followWatchId);
    followWatchId = null;
  }

  followMode = true;
  lastGps = null;
  lastHeading = map.getBearing() || 0;
  lastDriveMapUpdate = 0;

  setMenu(false);

  document.getElementById("followBtn").classList.add("active");
  document.getElementById("followBtn").textContent = "🚗 Stop Drive";
  document.getElementById("driveInfo").style.display = "block";

  status("Drive mode started.");

  followWatchId = navigator.geolocation.watchPosition(
    position => {
      if (!followMode) return;

      const now = Date.now();
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;
      const speed = position.coords.speed;

      let heading = position.coords.heading;

      /*
        When the browser does not give a reliable heading,
        calculate the direction from the last GPS point.
      */
      if ((heading == null || Number.isNaN(heading)) && lastGps) {
        const moved = distanceMetres(lastGps, { lat, lng });

        if (moved >= 3) {
          heading = calculateBearing(lastGps, { lat, lng });
        }
      }

      /*
        Smooth turns and always use the shortest rotation path.
        Ignore tiny heading changes that make the map shake.
      */
      if (heading != null && !Number.isNaN(heading)) {
        const difference = ((heading - lastHeading + 540) % 360) - 180;

        if (Math.abs(difference) > 1.5) {
          lastHeading = (lastHeading + difference * 0.42 + 360) % 360;
        }
      }

      /*
        The arrow is VIEWPORT aligned and stays pointing toward
        the top of the phone. The map rotates underneath it.
      */
      smoothGpsMarkerTo(lng, lat, 850);

      /*
        Smooth map movement instead of jumpTo(). New GPS fixes
        blend into the previous camera animation, which removes
        the stop/start "game lag" look.
      */
      if (now - lastDriveMapUpdate > 300) {
        lastDriveMapUpdate = now;

        let zoom = 17.1;

        if (speed != null) {
          const kmh = Math.max(0, speed * 3.6);

          if (kmh > 85) {
            zoom = 15.9;
          } else if (kmh > 55) {
            zoom = 16.25;
          } else if (kmh > 30) {
            zoom = 16.65;
          }
        }

        map.easeTo({
          center: [lng, lat],
          bearing: lastHeading,
          zoom,
          pitch: 0,
          duration: 850,
          easing: t => 1 - Math.pow(1 - t, 3)
        });
      }

      let speedKmh = null;

      if (speed != null) {
        speedKmh = Math.max(0, speed * 3.6);
      }

      document.getElementById("driveInfo").innerHTML =
        (speedKmh == null ? "" : `${speedKmh.toFixed(0)} km/h • `) +
        `GPS ±${Math.round(accuracy)} m`;

      /* Hydrants refresh slowly while driving to keep performance smooth. */
      if (hydrantsOn && now - driveHydrantReloadTime > 20000) {
        driveHydrantReloadTime = now;
        loadHydrants();
      }

      lastGps = { lat, lng };
    },
    error => {
      console.error("Drive GPS error:", error);
      status("Please allow precise location.");
      stopDrive();
    },
    {
      enableHighAccuracy: true,
      maximumAge: 250,
      timeout: 15000
    }
  );
}

function stopDrive() {
  followMode = false;

  if (gpsMarkerAnimation) {
    cancelAnimationFrame(gpsMarkerAnimation);
    gpsMarkerAnimation = null;
  }

  if (followWatchId != null) {
    navigator.geolocation.clearWatch(followWatchId);
    followWatchId = null;
  }

  document.getElementById("followBtn").classList.remove("active");
  document.getElementById("followBtn").textContent = "🚗 Start Drive";
  document.getElementById("driveInfo").style.display = "none";

  status("Drive mode stopped.");
}

/* =========================
   ROUTE LINE HELPERS
========================= */

function setLine(
  id,
  points,
  color,
  opacity = .5,
  width = 7,
  dash = null
) {
  if (points.length < 2) return;

  const data = {
    type: "Feature",
    geometry: {
      type: "LineString",
      coordinates:
        points.map(point => [
          point.lng,
          point.lat
        ])
    }
  };

  if (map.getSource(id)) {
    map.getSource(id).setData(data);
    return;
  }

  map.addSource(id, {
    type: "geojson",
    data
  });

  const paint = {
    "line-color": color,
    "line-width": width,
    "line-opacity": opacity
  };

  if (dash) {
    paint["line-dasharray"] = dash;
  }

  map.addLayer({
    id,
    type: "line",
    source: id,
    layout: {
      "line-join": "round",
      "line-cap": "round"
    },
    paint
  });
}

function removeLine(id) {
  if (map.getLayer(id)) {
    map.removeLayer(id);
  }

  if (map.getSource(id)) {
    map.removeSource(id);
  }
}

   DRAW ROUTE
========================= */

document.getElementById("drawBtn").addEventListener("click", () => {
  drawing = true;
  drawPoints = [];

  removeLine("drawRoute");
  setMenu(false);

  status("Draw mode ON. Tap points on map.");
});

function addDrawPoint(lat, lng) {
  drawPoints.push({ lat, lng });

  setLine(
    "drawRoute",
    drawPoints,
    selectedColor(),
    .45,
    7
  );

  status(
    `Drawing • ${(routeDistance(drawPoints) / 1000).toFixed(2)} km`
  );
}

document.getElementById("finishDrawBtn").addEventListener("click", () => {
  drawing = false;

  if (drawPoints.length < 2) {
    alert("Draw at least 2 points.");
    return;
  }

  let name = prompt("Route name:");

  if (!name) {
    name = "Drawn Route";
  }

  saveRoute(
    name,
    drawPoints,
    selectedColor()
  );

  status(
    `${name} saved.<br>` +
    `Distance: ${(routeDistance(drawPoints) / 1000).toFixed(2)} km`
  );
});

document.getElementById("clearDrawBtn").addEventListener("click", () => {
  drawing = false;
  drawPoints = [];

  removeLine("drawRoute");

  status("Draw route cleared.");
});

/* =========================
   GPS ROUTE RECORDING
========================= */

document.getElementById("recordBtn").addEventListener("click", startRecording);

function startRecording() {
  if (!navigator.geolocation) {
    status("GPS not supported.");
    return;
  }

  if (recordingWatchId != null) {
    navigator.geolocation.clearWatch(recordingWatchId);
    recordingWatchId = null;
  }

  recordedPoints = [];
  recording = true;
  recordingPaused = false;

  removeLine("recordRoute");
  setMenu(false);

  recordingWatchId =
    navigator.geolocation.watchPosition(
      position => {
        if (!recording || recordingPaused) {
          return;
        }

        if (position.coords.accuracy > 45) {
          return;
        }

        const point = {
          lat: position.coords.latitude,
          lng: position.coords.longitude
        };

        const previous =
          recordedPoints[
            recordedPoints.length - 1
          ];

        if (
          previous &&
          distanceMetres(previous, point) < 1.5
        ) {
          return;
        }

        recordedPoints.push(point);

        setLine(
          "recordRoute",
          recordedPoints,
          selectedColor(),
          .55,
          7
        );

        status(
          `Recording • ${(routeDistance(recordedPoints) / 1000).toFixed(2)} km` +
          `<br>GPS ±${Math.round(position.coords.accuracy)} m`
        );
      },
      () => {
        status("Recording GPS error.");
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );

  status("Recording started.");
}

document.getElementById("pauseBtn").addEventListener("click", () => {
  if (!recording) return;

  recordingPaused = true;
  status("Recording paused.");
});

document.getElementById("resumeBtn").addEventListener("click", () => {
  if (!recording) return;

  recordingPaused = false;
  status("Recording resumed.");
});

document.getElementById("stopBtn").addEventListener("click", () => {
  recording = false;
  recordingPaused = false;

  if (recordingWatchId != null) {
    navigator.geolocation.clearWatch(recordingWatchId);
    recordingWatchId = null;
  }

  status(
    `Recording stopped.<br>` +
    `Distance: ${(routeDistance(recordedPoints) / 1000).toFixed(2)} km`
  );
});

document.getElementById("saveBtn").addEventListener("click", () => {
  if (recordedPoints.length < 2) {
    alert("No route to save.");
    return;
  }

  const name = prompt("Route name:");

  if (!name) return;

  saveRoute(
    name,
    recordedPoints,
    selectedColor()
  );

  status(`${name} saved.`);
});

/* =========================
   IMPORT GPX FILE
========================= */

const importGpxBtn = document.getElementById("importGpxBtn");
const gpxFileInput = document.getElementById("gpxFileInput");

importGpxBtn.addEventListener("click", () => {
  gpxFileInput.value = "";
  gpxFileInput.click();
});

gpxFileInput.addEventListener("change", async () => {
  const file = gpxFileInput.files?.[0];

  if (!file) {
    return;
  }

  try {
    status("Reading GPX route...");

    const xmlText = await file.text();
    const xml = new DOMParser().parseFromString(xmlText, "application/xml");

    if (xml.querySelector("parsererror")) {
      throw new Error("Invalid GPX file");
    }

    let pointNodes = [
      ...xml.querySelectorAll("trkpt")
    ];

    if (!pointNodes.length) {
      pointNodes = [
        ...xml.querySelectorAll("rtept")
      ];
    }

    if (!pointNodes.length) {
      throw new Error("No route points found");
    }

    const points = [];

    for (const node of pointNodes) {
      const lat = Number(node.getAttribute("lat"));
      const lng = Number(node.getAttribute("lon"));

      if (
        Number.isFinite(lat) &&
        Number.isFinite(lng)
      ) {
        points.push({ lat, lng });
      }
    }

    if (points.length < 2) {
      throw new Error("Not enough valid GPX points");
    }

    const gpxNameNode =
      xml.querySelector("trk > name") ||
      xml.querySelector("rte > name") ||
      xml.querySelector("metadata > name");

    let routeName =
      gpxNameNode?.textContent?.trim() ||
      file.name.replace(/\.gpx$/i, "");

    routeName = prompt(
      "Route name:",
      routeName
    ) || routeName;

    saveRoute(
      routeName,
      points,
      selectedColor()
    );

    const routeId =
      getRoutes()
        .slice()
        .reverse()
        .find(route => route.name === routeName)?.id;

    if (routeId) {
      document.getElementById("savedRoutes").value =
        String(routeId);
    }

    removeLine("oldRoute");

    setLine(
      "oldRoute",
      points,
      selectedColor(),
      .42,
      9,
      [2, 1.5]
    );

    const bounds =
      new maplibregl.LngLatBounds();

    points.forEach(point => {
      bounds.extend([
        point.lng,
        point.lat
      ]);
    });

    map.fitBounds(
      bounds,
      {
        padding: 70,
        maxZoom: 17
      }
    );

    status(
      `Imported "${routeName}" • ${points.length} GPX points.<br>` +
      `Saved on this device/browser.`
    );

  } catch (error) {
    console.error("GPX import error:", error);

    status(
      "Could not import that GPX file. Make sure it contains a track or route."
    );
  }
});


/* =========================
   SAVED ROUTES
========================= */


function installPreloadedGpxRoutes() {
  const installKey = "faranPreloadedGpxV1";

  if (localStorage.getItem(installKey) === "done") {
    return;
  }

  let routes = [];

  try {
    routes = JSON.parse(localStorage.getItem("faranRoutes") || "[]");
  } catch {
    routes = [];
  }

  const existingIds = new Set(routes.map(route => Number(route.id)));

  for (const route of PRELOADED_GPX_ROUTES) {
    if (!existingIds.has(Number(route.id))) {
      routes.push(route);
    }
  }

  localStorage.setItem("faranRoutes", JSON.stringify(routes));
  localStorage.setItem(installKey, "done");
}

function getRoutes() {
  try {
    return JSON.parse(
      localStorage.getItem("faranRoutes") ||
      "[]"
    );
  } catch {
    return [];
  }
}

function saveRoute(name, points, color) {
  const routes = getRoutes();

  routes.push({
    id: Date.now(),
    name,
    color,
    date: new Date().toLocaleString(),
    points
  });

  localStorage.setItem(
    "faranRoutes",
    JSON.stringify(routes)
  );

  refreshRoutes();
}

function refreshRoutes() {
  const selector =
    document.getElementById("savedRoutes");

  selector.innerHTML =
    '<option value="">Select old route</option>';

  getRoutes().forEach(route => {
    const option =
      document.createElement("option");

    option.value = route.id;
    option.textContent =
      `${route.name} • ${route.date}`;

    selector.appendChild(option);
  });
}

document.getElementById("loadRouteBtn").addEventListener("click", () => {
  const id =
    Number(
      document.getElementById("savedRoutes").value
    );

  if (!id) return;

  const route =
    getRoutes().find(
      item => item.id === id
    );

  if (!route) return;

  removeLine("oldRoute");

  setLine(
    "oldRoute",
    route.points,
    route.color,
    .38,
    9,
    [2, 1.5]
  );

  const bounds =
    new maplibregl.LngLatBounds();

  route.points.forEach(point => {
    bounds.extend([
      point.lng,
      point.lat
    ]);
  });

  map.fitBounds(
    bounds,
    {
      padding: 70,
      maxZoom: 17
    }
  );

  status(
    `Old route "${route.name}" loaded.`
  );
});

document.getElementById("hideRouteBtn").addEventListener("click", () => {
  removeLine("oldRoute");
  status("Old route hidden.");
});

document.getElementById("deleteRouteBtn").addEventListener("click", () => {
  const id =
    Number(
      document.getElementById("savedRoutes").value
    );

  if (!id) {
    alert("Select a route first.");
    return;
  }

  const routes =
    getRoutes().filter(
      route => route.id !== id
    );

  localStorage.setItem(
    "faranRoutes",
    JSON.stringify(routes)
  );

  removeLine("oldRoute");
  refreshRoutes();

  status("Route deleted.");
});

/* =========================
   SASKATOON HYDRANTS
========================= */

document.getElementById("hydrantBtn").addEventListener("click", async () => {
  hydrantsOn = !hydrantsOn;

  if (!hydrantsOn) {
    hideHydrants();
    return;
  }

  const button =
    document.getElementById("hydrantBtn");

  button.classList.add("active");
  button.textContent = "🔥 Hydrants ON";

  await loadHydrants();
});

function hideHydrants() {
  if (map.getLayer("hydrant-points")) {
    map.removeLayer("hydrant-points");
  }

  if (map.getSource("hydrants")) {
    map.removeSource("hydrants");
  }

  hydrantsOn = false;

  const button =
    document.getElementById("hydrantBtn");

  button.classList.remove("active");
  button.textContent = "🔥 Hydrants";

  status("Hydrants hidden.");
}

async function loadHydrants() {
  if (!hydrantsOn) return;

  status("Loading Saskatoon hydrants...");

  const bounds = map.getBounds();

  const geometry = {
    xmin: bounds.getWest(),
    ymin: bounds.getSouth(),
    xmax: bounds.getEast(),
    ymax: bounds.getNorth(),
    spatialReference: {
      wkid: 4326
    }
  };

  const params =
    new URLSearchParams({
      where: "1=1",
      geometry: JSON.stringify(geometry),
      geometryType: "esriGeometryEnvelope",
      spatialRel: "esriSpatialRelIntersects",
      inSR: "4326",
      outSR: "4326",
      outFields: "*",
      returnGeometry: "true",
      f: "geojson"
    });

  try {
    const response =
      await fetch(
        HYDRANT_SERVICE +
        "?" +
        params.toString()
      );

    if (!response.ok) {
      throw new Error("Hydrant request failed");
    }

    const data =
      await response.json();

    if (data.error) {
      throw new Error(
        data.error.message ||
        "ArcGIS error"
      );
    }

    const features =
      data.features || [];

    if (map.getSource("hydrants")) {
      map.getSource("hydrants").setData(data);
    } else {
      map.addSource(
        "hydrants",
        {
          type: "geojson",
          data
        }
      );

      map.addLayer({
        id: "hydrant-points",
        type: "circle",
        source: "hydrants",
        paint: {
          "circle-radius": [
            "interpolate",
            ["linear"],
            ["zoom"],
            12, 3,
            14, 4,
            16, 6,
            18, 8
          ],
          "circle-color": "#e53935",
          "circle-stroke-color": "#ffffff",
          "circle-stroke-width": 1.8,
          "circle-opacity": .98
        }
      });

      map.on("click", "hydrant-points", event => {
        event.originalEvent.stopPropagation();

        const feature =
          event.features?.[0];

        if (!feature) return;

        const p =
          feature.properties || {};

        const coordinates =
          feature.geometry.coordinates.slice();

        const node =
          p.WMNODENO ??
          p.WM_NODE_NO ??
          p.NODE_NO ??
          p.FACILITYID ??
          "Unknown";

        const statusValue =
          p.STATUS ??
          p.Status ??
          "Unknown";

        const typeValue =
          p.HYDRANT_TYPE ??
          p.HYDRANTTYPE ??
          p.TYPE ??
          "Unknown";

        const yearValue =
          p.YEAR_CONSTRUCTED ??
          p.YEARCONSTRUCTED ??
          p.INSTALL_YEAR ??
          "Unknown";

        new maplibregl.Popup({
          offset: 12,
          closeButton: true
        })
        .setLngLat(coordinates)
        .setHTML(
          `<strong>🔥 Fire Hydrant</strong><br><br>` +
          `Node #: ${node}<br>` +
          `Status: ${statusValue}<br>` +
          `Type: ${typeValue}<br>` +
          `Year: ${yearValue}<br><br>` +
          `<a href="${REPORT_HYDRANT_URL}" target="_blank" rel="noopener">Report Hydrant Issue</a>`
        )
        .addTo(map);
      });

      map.on("mouseenter", "hydrant-points", () => {
        map.getCanvas().style.cursor = "pointer";
      });

      map.on("mouseleave", "hydrant-points", () => {
        map.getCanvas().style.cursor = "";
      });
    }

    status(
      `${features.length} hydrants loaded in this map area.`
    );
  } catch (error) {
    console.error("Hydrant error:", error);

    status(
      "Could not load hydrants. Zoom into Saskatoon and try again."
    );
  }
}

/* Reload hydrants after normal map movement,
   but not constantly while Drive Mode is running. */
map.on("moveend", () => {
  if (!hydrantsOn || followMode) {
    return;
  }

  clearTimeout(hydrantReloadTimer);

  hydrantReloadTimer =
    setTimeout(
      loadHydrants,
      700
    );
});

/* =========================
   STARTUP
========================= */

map.on("load", () => {
  installPreloadedGpxRoutes();
  refreshRoutes();
  updateCompass();

  status("Map ready.");

  /*
    Center near user automatically if permission already exists.
    It does not force Drive Mode to start.
  */
  setTimeout(() => {
    if (!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(
      position => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        updateGpsMarker(lng, lat, 0);

        map.flyTo({
          center: [lng, lat],
          zoom: 16,
          duration: 600
        });
      },
      () => {
        /* User can press GPS later */
      },
      {
        enableHighAccuracy: true,
        timeout: 8000,
        maximumAge: 30000
      }
    );
  }, 700);
});
</script>
</body>
</html>
